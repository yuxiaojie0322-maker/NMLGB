name: VPS8 自动签到与续期

on:
  workflow_dispatch:
    inputs:
      enable_f1:
        description: '启用 F1 签到'
        required: false
        default: true
        type: boolean
      enable_f2:
        description: '启用 F2 签到'
        required: false
        default: true
        type: boolean
      enable_f3:
        description: '启用 F3 签到'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [run-vps8]

permissions:
  contents: write
  actions: write

# =========================================================
#                账号配置区
# =========================================================
env:
  # ---------- F1 账号 ----------
  F1_NODE_LINK: ${{ secrets.F1_NODE_LINK }}
  F1_VPS8:      ${{ secrets.VPS8 }}
  F1_STAGGER:   "0"

  # ---------- F2 账号 ----------
  F2_NODE_LINK: ${{ secrets.F2_NODE_LINK }}
  F2_VPS8:      ${{ secrets.VPS82 }}
  F2_STAGGER:   "20"

  # ---------- F3 账号 ----------
  F3_NODE_LINK: ${{ secrets.F3_NODE_LINK }}
  F3_VPS8:      ${{ secrets.VPS83 }}
  F3_STAGGER:   "40"

  # ---------- 公共配置 ----------
  VPS8_RENEW_TEST: "0"
  TG_BOT_TOKEN:    ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID:      ${{ secrets.TG_CHAT_ID }}
  OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
  OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
  OPENAI_MODEL:    ${{ secrets.OPENAI_MODEL }}
  NOPECHA_KEY:     ${{ secrets.NOPECHA_KEY }}
  NONECAP_KEY:     ${{ secrets.NONECAP_KEY || vars.NONECAP_KEY }}
# =========================================================

jobs:
  # ========================= F1 =========================
  sign-f1:
    name: F1 签到
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || inputs.enable_f1 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: 检查账号配置
        id: check
        run: |
          if [ -z "$F1_VPS8" ]; then
            echo "⚠️ [跳过] 未检测到 F1 账号 (VPS8) 密匙，跳过本次执行"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "NODE_LINK=${{ env.F1_NODE_LINK }}" >> "$GITHUB_ENV"
            echo "VPS8=${{ env.F1_VPS8 }}" >> "$GITHUB_ENV"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 错峰等待
        if: steps.check.outputs.skip != 'true'
        run: sleep ${{ env.F1_STAGGER }}

      - name: 检出代码仓库
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 pip
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ github.job }}-v3
          restore-keys: |
            ${{ runner.os }}-pip-${{ github.job }}-

      - name: 安装系统依赖
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb fonts-noto-cjk p7zip-full jq netcat-openbsd git

      - name: 安装 Python 库
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install -q seleniumbase requests playwright opencv-python-headless \
                        msgpack typer matplotlib google-genai httpx nonecap \
                        loguru pydantic-settings tenacity pytz "requests[socks]"

      - name: 安装 ChromeDriver
        if: steps.check.outputs.skip != 'true'
        run: seleniumbase install chromedriver

      - name: 下载并解压 NopeCHA 扩展
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p scripts/extensions/nopecha
          wget -q -O scripts/extensions/nopecha/chromium.zip \
            https://github.com/NopeCHALLC/nopecha-extension/releases/download/0.6.1/chromium.zip
          7z x -y scripts/extensions/nopecha/chromium.zip -oscripts/extensions/nopecha/unpacked

      - name: 克隆 hcaptcha-challenger
        if: steps.check.outputs.skip != 'true'
        run: |
          git clone --depth 1 https://github.com/aoi675145/hcaptcha.git hcaptcha-challenger
          cd hcaptcha-challenger
          git fetch --depth 1 origin d4da375916cde6bb85128eb8fc9859e1f06cacbc \
            && git checkout --detach FETCH_HEAD \
            || echo "[WARN] 固定 commit 获取失败，使用克隆时的 main HEAD"
          git rev-parse HEAD

      - name: 设置代理
        if: steps.check.outputs.skip != 'true'
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            echo "❌ 代理设置失败，发送通知..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>F1 VPS8 签到失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      - name: 执行签到（第 1 次）
        id: attempt1
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: xvfb-run -a --server-args="-screen 0 1280x720x24" python -u scripts/VPS8/main_ai.py

      - name: 备份第 1 次截图并等待重试
        if: steps.check.outputs.skip != 'true' && steps.attempt1.outcome == 'failure'
        run: |
          if [ -d screenshots ]; then
            mkdir -p screenshots-attempt1
            find screenshots -maxdepth 1 -type f -name "*.png" -exec cp {} screenshots-attempt1/ \;
            rm -f screenshots/*.png
            echo "已备份第一次截图"
          fi
          echo "等待 30 秒后重试..."
          sleep 30

      - name: 执行签到（第 2 次）
        if: steps.check.outputs.skip != 'true' && steps.attempt1.outcome == 'failure'
        timeout-minutes: 15
        run: xvfb-run -a --server-args="-screen 0 1280x720x24" python -u scripts/VPS8/main_ai.py

      - name: 上传执行截图
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.job }}-${{ github.run_number }}
          path: |
            screenshots-attempt1/
            screenshots/
          retention-days: 3
          if-no-files-found: ignore

  # ========================= F2 =========================
