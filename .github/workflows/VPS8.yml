  # ========================= 统一维护与清理 =========================
  maintenance:
    name: 仓库保活与清理历史记录
    runs-on: ubuntu-22.04
    needs: [sign-f1, sign-f2, sign-f3]
    if: always()
    permissions:
      contents: write
      actions: write
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 提交 time.txt 保持仓库活跃
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "时间戳无变化，无需提交"
          else
            git commit -m "⏱️ 更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD || true
          fi

      - name: 清理历史运行记录（保留最新 2 条）
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 2;
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo:  context.repo.repo,
            });
            const wf = workflows.data.workflows.find(w => w.name === "VPS8 自动签到与续期");
            if (!wf) {
              console.log("未找到 workflow，跳过清理");
              return;
            }
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                workflow_id: wf.id,
                per_page:    100,
              }
            );
            // 排除当前正在运行的本次任务以及未完成的任务
            const completedRuns = runs.filter(r => r.id !== context.runId && r.status === 'completed');
            const toDelete = completedRuns.slice(KEEP);
            console.log(`历史完成记录共 ${completedRuns.length} 条，保留 ${KEEP} 条，准备清理 ${toDelete.length} 条`);
            for (const run of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner:  context.repo.owner,
                  repo:   context.repo.repo,
                  run_id: run.id,
                });
                console.log(`已删除历史记录 #${run.run_number} (id=${run.id})`);
              } catch (err) {
                console.warn(`跳过删除历史记录 #${run.run_number}: ${err.message}`);
              }
            }
